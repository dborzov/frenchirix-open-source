[project]
name = "frenchirix"
version = "0.1.0"
description = "Cuts short scenes out of French TV episodes for a flashcard-style learning app"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
frenchirix = "frenchirix.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
# Speech recognition and forced alignment (docs/transcription.md). Not installed by
# default: `uv sync --group asr`. Nothing outside transcribe/forced_align imports these.
asr = [
    "faster-whisper>=1.2",
    # CTranslate2 (under faster-whisper) is built for CUDA 12 and loads libcublas.so.12;
    # torch brings only CUDA 13 cuBLAS. cuDNN 9 is shared with torch: a cu12 cuDNN wheel
    # would overwrite torch's cu13 one (same file paths). See docs/transcription.md.
    "nvidia-cublas-cu12==12.9.1.4",
    "torch==2.14.1",
    "torchaudio>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that load speech models or read content/ are marked slow and skipped by default;
# `pytest -m slow` runs only them.
markers = ["slow: loads speech models or reads content/ (run with -m slow)"]
addopts = ["-m", "not slow"]
