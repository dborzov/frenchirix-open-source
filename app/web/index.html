<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Frenchirix</title>
    <meta name="description" content="Learn French from the Gauls, one scene at a time." />
    <!-- Installing (docs/app-install.md). The manifest and icons are public (worker/pwa.ts APP_PUBLIC_FILES):
         browsers fetch the manifest without cookies. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e8303a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS: the home-screen title and a light status bar over the app's own bar (the app pads for the notch). -->
    <meta name="apple-mobile-web-app-title" content="Frenchirix" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
